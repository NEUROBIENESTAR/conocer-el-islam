<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada | Conociendo el Islam</title>
<meta name="description" content="Esta página no existe o cambió de lugar. Vuelve al inicio o a los módulos.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F7F4EF; --ink:#2C2B27; --ink-soft:#565349; --sage-deep:#5C7268; --terracotta:#C08552; --line:rgba(44,43,39,0.14); }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:'Montserrat',sans-serif; line-height:1.7; display:flex; align-items:center; justify-content:center; padding:40px 24px; text-align:center; }
  .box{ max-width:460px; }
  .brand{ display:block; font-family:'Fraunces',serif; font-size:18px; color:var(--ink-soft); text-decoration:none; margin-bottom:36px; }
  .brand em{ font-style:italic; color:var(--sage-deep); }
  .eyebrow{ font-size:11.5px; letter-spacing:0.2em; text-transform:uppercase; color:var(--terracotta); font-weight:700; margin-bottom:12px; display:block; }
  h1{ font-family:'Fraunces',serif; font-weight:400; font-size:clamp(28px,5vw,38px); margin:0 0 14px 0; }
  p{ color:var(--ink-soft); font-size:15.5px; margin:0 0 28px 0; }
  .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn{ display:inline-block; padding:13px 26px; border-radius:100px; font-weight:600; font-size:14.5px; text-decoration:none; border:1px solid transparent; }
  .btn-primary{ background:var(--sage-deep); color:#fff; }
  .btn-primary:hover{ background:var(--ink); }
  .btn-outline{ color:var(--ink); border-color:var(--line); }
  .btn-outline:hover{ border-color:var(--sage-deep); color:var(--sage-deep); }
</style>
</head>
<body>
<div class="box">
  <a href="/" class="brand">Conociendo el <em>Islam</em></a>
  <span class="eyebrow">Error 404</span>
  <h1>Esta página no existe (todavía)</h1>
  <p>Puede que el enlace haya cambiado o que el contenido aún esté en preparación. Puedes volver al inicio o explorar los módulos disponibles.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">Volver al inicio</a>
    <a href="/modulos.html" class="btn btn-outline">Ver módulos</a>
  </div>
</div>
</body>
</html>
